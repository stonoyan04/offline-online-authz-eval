[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentauthz"
version = "0.1.0"
description = "Offline-verifiable authorization for AI agents, compared with online authorization"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Smbat Tonoyan", email = "tonoyansmbat04@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "biscuit-python==0.4.0",
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sniffio>=1.3",  # httpcore imports it per lock; missing, each import walks sys.path
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["agentauthz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
